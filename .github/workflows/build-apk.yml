name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Préparer les fichiers web
        run: |
          mkdir www
          cp index.html www/
          cp manifest.json www/ || true
          cp sw.js www/ || true
          cp native-tts.js www/
          cp native-stt.js www/
          cp glossaire-initial.js www/
          find . -maxdepth 1 -type f \( -name '*.png' -o -name '*.svg' -o -name '*.ico' -o -name '*.jpg' -o -name '*.webp' \) -exec cp {} www/ \;
          sed -i '0,/<script/s//<script src="native-tts.js"><\/script>\n<script/' www/index.html
          sed -i '0,/<script/s//<script src="native-stt.js"><\/script>\n<script/' www/index.html
          sed -i '0,/<script/s//<script src="glossaire-initial.js"><\/script>\n<script/' www/index.html
          grep -n "<script src" www/index.html

      - name: Installer Capacitor
        run: |
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 @capacitor-community/text-to-speech@5 @capacitor-community/speech-recognition@6
          npx cap init "LexiTrilingue Pro" com.mahmoh.lexitrilingue --web-dir www
          npx cap add android
          npx cap sync android

      - name: Autoriser le moteur vocal Android
        run: |
          sed -i 's#</manifest>#    <queries>\n        <intent>\n            <action android:name="android.intent.action.TTS_SERVICE" />\n        </intent>\n    </queries>\n</manifest>#' android/app/src/main/AndroidManifest.xml
          grep -n "TTS_SERVICE" android/app/src/main/AndroidManifest.xml

      - name: Compiler l'APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: LexiTrilingue-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
